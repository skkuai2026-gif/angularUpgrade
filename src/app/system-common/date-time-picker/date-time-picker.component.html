<ui5-date-picker
  #datePicker
  [id]="fieldID"
  origami
  [value]="model[fieldCd + '_dt']"
  [(ngModel)]="model[fieldCd + '_dt']"
  [disabled]="isDisabled"
  [attr.name]="fieldUnName"
  (change)="onInputChange(model, $event)"
  (blur)="onInputChange(model, $event)"
  class="form-control customDatePicker"
  [minDate]="minDateValue != undefined ? minDateValue : ''"
  [maxDate]="maxDateValue != undefined ? maxDateValue : ''"
  [placeholder]="placeholder != undefined ? placeholder : symDateFormat.toUpperCase()"
  [formatPattern]="symDateFormat"
  [primaryCalendarType]="calendarType"
  [hideWeekNumbers]="true"
  ngDefaultControl
>
  <div slot="valueStateMessage">Please enter the correct format DD-MMM-YYYY</div>
</ui5-date-picker>
