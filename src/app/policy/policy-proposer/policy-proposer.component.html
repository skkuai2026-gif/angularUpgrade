<sym-xml-config-ui
  [xmlDom]="xmlDom"
  [service]="service"
  [responseIO]="service.responseIO"
  (notifyChange)="onInputChanged($event)"
  (notifyFocus)="onInputFocused($event)"
  (onRowAdded)="onGridRowAdded($event)"
  [responseUpdated]="responseUpdated"
>
</sym-xml-config-ui>
} @else { @if (service.responseIO && service.responseIO.data && service.responseIO.data.length != 0) {
<sym-policy-party-details [model]="service.responseIO.data.Proposer"></sym-policy-party-details>
} }
