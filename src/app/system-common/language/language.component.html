<div class="card card-outline-secondary">
  <div class="card-body">
    <div class="input-group mb-3">
      <div>
        <div class="radioGrp radio language_container">
          @for (lang of languageList; track lang) {
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="language"
              [id]="lang.cd"
              value="{{ lang.cd }}"
              (click)="selectedLanguage = $event.target.value"
              [checked]="lang.cd == settingService.getLanguageSelected() ? true : false"
            />
            <label class="form-check-label" [attr.for]="lang.cd">{{ lang.desc }}</label>
          </div>
          }
        </div>
      </div>
    </div>

    <div class="d-flex">
      <sym-button
        [class]="'btn btn_primary float-right'"
        [iconClass]="'fa fa-language pl-2'"
        (onClick)="onLanguageSelect()"
        [text]="'selectLanguage'"
        [isLoaderRequired]="false"
      ></sym-button>
      <!-- <button class="btn btn_primary float-right" (click)="onLanguageSelect()">
        <i class="fa fa-language" aria-hidden="true"></i>   {{ settingService.getLabelValue('selectLanguage') }}
      </button> -->
    </div>
  </div>
</div>
