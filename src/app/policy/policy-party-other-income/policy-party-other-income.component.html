@if (xmlDom != undefined) {
<sym-xml-config-ui
  [xmlDom]="xmlDom"
  [service]="service"
  [responseIO]="service.responseIO"
  (notifyChange)="onInputChanged($event)"
  (notifyFocus)="onInputFocused($event)"
  (onRowAdded)="onGridRowAdded($event)"
>
</sym-xml-config-ui>
} @else { @if (partyModel.OtherIncomeList != undefined) {
<sym-data-entry-grid
  [fieldIds]="'incomeTypeCd,sourceOfIncome,otherSourceIncome,incomeAmount,currencyCd,incomeYear'"
  [modelList]="partyModel.OtherIncomeList"
  [responseIO]="service.responseIO"
  (notifyChange)="onInputChanged($event)"
  [isFormFormatRequired]="true"
  (onRowAdded)="onAddPartyOtherIncome($event)"
  [isAddRequired]="!service.responseIO.data.Entity.isCompleted"
  [isDeleteRequired]="!service.responseIO.data.Entity.isCompleted"
></sym-data-entry-grid>
} }
