<sym-carousel>
  @for (responseIOMap of service.compareQuotaionResponseIOMap | keyvalue; track responseIOMap) {
  <div
    [style.width]="100 / service.compareQuotaionResponseIOMap.size + '%'"
    class="card div_border pb-5"
    [class.selected]="
      service.responseIO.data.BasePlan.productSeq == responseIOMap.value.data.BasePlan.productSeq &&
      service.getAdditionalData('ISQUOTESELECTED') == true
    "
  >
    <div class="quoteSelectionRadio">
      <label class="radio_Checkbox_Container">
        <input
          type="radio"
          [name]="'radio_' + responseIOMap.key"
          class="radioCheckboxInput"
          (click)="onQuoteSelection($event, responseIOMap.value)"
          [checked]="
            service.responseIO.data.BasePlan.productSeq == responseIOMap.value.data.BasePlan.productSeq &&
            service.getAdditionalData('ISQUOTESELECTED') == true
              ? true
              : false
          "
        />
        <span> </span>
      </label>
      <div>
        <sym-quotation-preview [quotationResponseIO]="responseIOMap.value"></sym-quotation-preview>
      </div>
    </div>
  </div>
  }
</sym-carousel>
