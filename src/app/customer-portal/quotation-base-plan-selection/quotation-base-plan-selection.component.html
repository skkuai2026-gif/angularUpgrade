@if (service.responseIO && service.responseIO.data && service.responseIO.data.length != 0) {
<span class="btnSelectCard" (click)="onSelectedBasePlan()"></span>
<h4>Quotation {{ quotationIndex }}</h4>
<div class="tbItem">
  <sym-field-group
    [fieldIds]="'productPlanOptionCd'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'paymentTypeCd'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'paymentFrequencyCd'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'productTerm'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'premiumPayingTerm'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'baseSumAssured'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'baseAnnualPremium'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
  <sym-field-group
    [fieldIds]="'modalPremium'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    [responseIO]="service.responseIO"
    [model]="service.responseIO.data.BasePlan"
    [gridColumns]="[12]"
    [prefix]="quotationIndex"
  ></sym-field-group>
</div>
@if (this.respApplicableProduct != undefined && planOption != undefined && planOption.html != undefined) {
<div class="planoption-card" [innerHTML]="planOption.html | safeHtml: 'html'"></div>
} }
