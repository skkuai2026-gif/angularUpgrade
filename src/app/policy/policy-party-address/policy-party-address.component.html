@if (selectedStep.selectedTab.id != 'tab_nominee') {
<div>
  <div>
    @if (model?.addressTypeCd === 'RESIDENTIAL') {
    <sym-field-group
      [fieldIds]="'countryCd'"
      (notifyChange)="onInputChanged($event)"
      (notifyFocus)="onInputFocused($event)"
      (onFieldsCreated)="onAddressFieldsCreated($event)"
      [responseIO]="service.responseIO"
      [model]="model"
      [modelPath]="modelPath"
    >
    </sym-field-group>
    }
  </div>
  <div id="alignmentCountry" [ngClass]="{ 'permanent-address': model?.addressTypeCd === 'PERMANENT' }">
    @if (model?.addressTypeCd === 'PERMANENT') {
    <sym-field-group
      [fieldIds]="'countryCd'"
      (notifyChange)="onInputChanged($event)"
      (notifyFocus)="onInputFocused($event)"
      (onFieldsCreated)="onAddressFieldsCreated($event)"
      [responseIO]="service.responseIO"
      [model]="model"
      [modelPath]="modelPath"
    >
    </sym-field-group>
    }
  </div>
  <div id="alignmentCountry" [ngClass]="{ 'permanent-address': model?.addressTypeCd === 'OFFICE' }">
    @if (model?.addressTypeCd === 'OFFICE') {
    <sym-field-group
      [fieldIds]="'countryCd'"
      (notifyChange)="onInputChanged($event)"
      (notifyFocus)="onInputFocused($event)"
      (onFieldsCreated)="onAddressFieldsCreated($event)"
      [responseIO]="service.responseIO"
      [model]="model"
      [modelPath]="modelPath"
    >
    </sym-field-group>
    }
  </div>
  <sym-field-group
    [fieldIds]="'addressLine1Lang1,stateCd,addressLine2Lang1,cityCd,addressLine3Lang1,pinCode'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    (onFieldsCreated)="onAddressFieldsCreated($event)"
    [responseIO]="service.responseIO"
    [model]="model"
    [modelPath]="modelPath"
  ></sym-field-group>
</div>
} @if (selectedStep.selectedTab.id == 'tab_nominee') {
<div>
  <sym-field-group
    [fieldIds]="'addressLine1Lang1,countryCd'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    (onFieldsCreated)="onAddressFieldsCreated($event)"
    [responseIO]="service.responseIO"
    [model]="model"
    [modelPath]="modelPath"
  >
  </sym-field-group>
  <sym-field-group
    [fieldIds]="'stateCd,addressLine2Lang1,cityCd,addressLine3Lang1,pinCode'"
    (notifyChange)="onInputChanged($event)"
    (notifyFocus)="onInputFocused($event)"
    (onFieldsCreated)="onAddressFieldsCreated($event)"
    [responseIO]="service.responseIO"
    [model]="model"
    [modelPath]="modelPath"
  ></sym-field-group>
</div>
}
