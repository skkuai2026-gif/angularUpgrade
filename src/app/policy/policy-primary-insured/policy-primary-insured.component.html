@if (xmlDom != undefined) {
<sym-xml-config-ui
  [xmlDom]="xmlDom"
  [service]="service"
  [responseIO]="service.responseIO"
  (notifyChange)="onInputChanged($event)"
  (notifyFocus)="onInputFocused($event)"
  (onRowAdded)="onGridRowAdded($event)"
>
</sym-xml-config-ui>
} @else {
<sym-field-group
  [fieldIds]="'insuredSameAsProposer'"
  (notifyChange)="onInputChanged($event)"
  [responseIO]="service.responseIO"
  [model]="service.responseIO.data.Entity"
></sym-field-group>
@if ( service.responseIO && service.responseIO.data && service.responseIO.data.length != 0 &&
(service.responseIO.data.Entity.insuredSameAsProposer == '' || service.responseIO.data.Entity.insuredSameAsProposer
== false) ) {
<div class="card m-1">
  <sym-policy-party-details [model]="service.responseIO.data.PrimaryInsured"></sym-policy-party-details>
</div>
} }
