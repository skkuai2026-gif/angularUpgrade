<div class="innerVerticalTab">

  <div class="ivtRight" [style.width]="!settingService.isMobileViewRendered() ? 'calc(100% - 290px)' : 100 + '%'">
    <h2>What are your objectives of buying our product?</h2>
    <h6 class="note">(Choose one or more)</h6>
    @if (settingService.getApplicationMode() === 'offline') {
    <sym-carousel>
      @for (item of fnaSlideScreen; track item; let i = $index) {
      <div class="card fna-card-con">
        <div class="fna-card-container">
          <div class="fnaSlide" [attr.data-slide-no]="i + 1">
            <div class="fnaSliderContent">
              <input
                class=""
                type="checkbox"
                name="inputCheckboxSlider"
                id="inputCheckboxSlider_{{ i }}"
                value="{{ item.html }}"
                (click)="onInputChanged($event)"
              />
              <div [innerHTML]="item.html | safeHtml: 'html'"></div>
            </div>
          </div>
        </div>
      </div>
      }
    </sym-carousel>
