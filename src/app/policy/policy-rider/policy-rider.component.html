@if ( service.responseIO && service.responseIO.data && service.responseIO.data.length != 0 && partyTabList &&
partyTabList.length > 0 ) { @if (partyTabList.length > 0) {
<sym-sub-tab [tabList]="partyTabList" (selectedTab)="setSelectedTab($event)">
  <ng-container class="tableContent scrollDiv scrollX">
    @if (partyWiseRiderMap != undefined) {
    <!-- {{ selectedPartyTab.id }} -->
    <sym-data-entry-grid
      [fieldIds]="
        'productLongName,productPlanOptionCd,baseSumAssured,modalPremium,productTerm,premiumPayingTerm,baseAnnualPremium'
      "
      [fieldIds]="'selected,productLongName,baseSumAssured'"
      [modelList]="partyWiseRiderMap.get(selectedPartyTab.id)"
      [responseIO]="service.responseIO"
      (notifyChange)="onRiderChanged($event)"
      (notifyFocus)="onRiderFocused($event)"
      [isMoreRequired]="true"
      (onMoreSelected)="setSelectedIndexOfRider($event)"
      [columWidthPerc]="[25, 25, 10, 10, 10, 10, 10]"
      [columWidthPerc]="[10, 40, 40]"
      [isAddRequired]="false"
      [isDeleteRequired]="false"
    ></sym-data-entry-grid>
    }
    <ng-container>
      @if (selectedIndex != undefined && selectedRider.RiderExtraList.length > 0) {
      <ng-container class="card m-2 p-2">
        <ng-container>
          <button class="btn float-right" (click)="closeRiderExtraList()">
            <i class="fa fa-close"></i>
          </button>
        </ng-container>
        <ng-container class="float-none"></ng-container>
        <sym-policy-rider-extra-list [model]="selectedRider"></sym-policy-rider-extra-list>
      </ng-container>
      }
    </ng-container>
  </ng-container>
</sym-sub-tab>
} }
