<ul class="breadcrum">
  @for (breadCrumb of breadCrumbList; track breadCrumb) {
  <li [ngClass]="breadCrumb.link == undefined ? 'inactive' : null">
    <a [routerLink]="breadCrumb.link">{{ breadCrumb.id }} </a>
  </li>
  }
</ul>
