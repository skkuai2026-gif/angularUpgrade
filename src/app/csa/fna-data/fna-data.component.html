<div>
  @if (service.responseIO && service.responseIO.data && service.responseIO.data.length != 0) {
  <sym-panel sym-panel [id]="'fna_Details_Body'" [name]="'PERSONALDETAILS'">
    <sym-field-group
      [fieldIds]="'firstName1,middleName1,lastName1,educationLevelCd'"
      (notifyChange)="onInputChanged($event)"
      [responseIO]="service.responseIO"
      [model]="service.responseIO.data.FNAParty"
    ></sym-field-group>
  </sym-panel>
  }
  <div>
    <sym-panel sym-panel [id]="'financial_Details_Body'" [name]="'FINANCIALDETAILS'">
      <sym-data-entry-grid
        id="fnaResponse"
        [fieldIds]="'fnaQuestionLookupDataCd'"
        [modelList]="service.responseIO.data.FNAParty.FNAQuestionResponseList"
        [responseIO]="service.responseIO"
        (notifyChange)="onInputChanged($event)"
        [isFormFormatRequired]="true"
        [formColumnWidth]="'12'"
        [isDeleteRequired]="false"
        [isAddRequired]="false"
      ></sym-data-entry-grid>
    </sym-panel>
  </div>
