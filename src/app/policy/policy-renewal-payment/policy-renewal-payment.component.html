@if (xmlDom != undefined) {
<sym-xml-config-ui
  [xmlDom]="xmlDom"
  [service]="service"
  [responseIO]="service.responseIO"
  (notifyChange)="onInputChanged($event)"
  (notifyFocus)="onInputFocused($event)"
  (onRowAdded)="onGridRowAdded($event)"
>
</sym-xml-config-ui>
} @else {
<sym-panel [id]="'renewal_payment_Body'" [name]="'renewalPayment'">
  <sym-payer-party [modelPath]="'RenewalPayment'" [responseUpdated]="responseUpdated"></sym-payer-party>
  @if (service.responseIO.data.RenewalPayment.payerTypeCd === 'OTHER') {
  <div>
    <div class="accordion" [id]="'RenewalOtherPayerParty'">
      <div class="card m-1">
        <sym-panel [id]="'renewal_other_payer_party_Body'" [name]="'Renewal Payment Payer Details '">
          <div class="accordion" id="accordionPartyDetails">
            <sym-policy-party-details [model]="service.responseIO.data.RenewalOtherPayerParty">
            </sym-policy-party-details>
          </div>
        </sym-panel>
      </div>
    </div>
  </div>
  }
  <sym-panel [id]="'payment_detail_Body'" [name]="'Payment Details'" [isSubPanel]="true">
    <sym-field-group
      [fieldIds]="'paymentMethodCd'"
      (notifyChange)="onInputChanged($event)"
      (notifyFocus)="onInputFocused($event)"
      [responseIO]="service.responseIO"
      [model]="service.responseIO.data.RenewalPayment"
      [gridColumns]="[12]"
    >
    </sym-field-group>
    <sym-field-group
      [fieldIds]="fieldIds"
      (notifyChange)="onInputChanged($event)"
      (notifyFocus)="onInputFocused($event)"
      [responseIO]="service.responseIO"
      [model]="service.responseIO.data.RenewalPayment.RenewalPaymentDetails"
    >
    </sym-field-group>
  </sym-panel>
</sym-panel>
}
